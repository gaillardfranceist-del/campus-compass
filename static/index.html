<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Compass</title>
<style>body{font:17px system-ui;background:#edf2f7;color:#182c40;max-width:850px;margin:40px auto;padding:20px}h1{margin-bottom:5px}.card{background:white;padding:24px;border-radius:16px;box-shadow:0 8px 30px #15263c12}#chat{min-height:280px;max-height:480px;overflow:auto}.message{white-space:pre-wrap;padding:14px;margin:12px 0;border-radius:10px;background:#f1f5f9}.user{background:#dcf0e9}textarea{width:100%;box-sizing:border-box;font:inherit;padding:12px;margin-top:18px}button{font:inherit;background:#176858;color:white;border:0;border-radius:7px;padding:10px 18px;margin:8px 5px 0 0}small{display:block;color:#506578;margin:12px 0}#status{white-space:pre-wrap;font:13px monospace}</style>
<h1>Campus Compass</h1><p>Your campus questions, answered with sources.</p><small>Fictional campus FAQ • Weather is simulated • Don’t enter secrets or personal records.</small><div class="card"><div id="chat" aria-live="polite"></div><form id="form"><label for="message">Message</label><textarea id="message" maxlength="4000" required placeholder="What are the library hours?"></textarea><button id="send">Send</button><button id="reset" type="button">New conversation</button></form><small id="status">Ready</small></div>
<script>
let cid=crypto.randomUUID();const chat=document.querySelector('#chat'),status=document.querySelector('#status');
function add(role,text){let el=document.createElement('div');el.className='message '+role;el.textContent=(role==='user'?'You: ':'Compass: ')+text;chat.append(el);return el;}
document.querySelector('#reset').onclick=()=>{cid=crypto.randomUUID();chat.replaceChildren();status.textContent='New conversation';};
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let input=document.querySelector('#message'),send=document.querySelector('#send'),reset=document.querySelector('#reset');let text=input.value.trim();if(!text)return;add('user',text);input.value='';send.disabled=reset.disabled=true;status.textContent='Thinking…';let el=add('assistant','');try{let res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,user_message:text})});if(!res.ok){let err=await res.json();throw Error(err.detail||'Request failed');}let reader=res.body.getReader(),decoder=new TextDecoder(),buffer='';while(true){let {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});let parts=buffer.split('\n\n');buffer=parts.pop();for(let part of parts){if(!part.startsWith('data: '))continue;let event=JSON.parse(part.slice(6));if(event.type==='delta')el.textContent+=event.text;if(event.type==='error')el.textContent+='\n'+event.message;if(event.type==='done'){let m=event.metrics;status.textContent=`${m.status} • ${m.latency_ms} ms • ${m.prompt_tokens} input / ${m.completion_tokens} output tokens • cost ${m.estimated_cost_usd===null?'not configured': '$'+m.estimated_cost_usd.toFixed(6)}`;}}chat.scrollTop=chat.scrollHeight;if(done)break;}}catch(err){status.textContent=err.message;}finally{send.disabled=reset.disabled=false;}};
</script></html>
